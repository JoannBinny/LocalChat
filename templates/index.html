<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ─────────────────────────────────────── */
    :root {
      --bg:          #0c0c10;
      --panel:       #13131a;
      --border:      #1e1e2a;
      --border-dim:  #17171f;
      --text:        #dcdce8;
      --text-muted:  #5a5a72;
      --text-dim:    #3a3a50;
      --accent:      #7c6af7;
      --accent-soft: #7c6af718;
      --accent-glow: #7c6af730;
      --user-bg:     #1a1830;
      --bot-bg:      #111118;
      --green:       #4ade80;
      --red:         #f87171;
      --mono:        'JetBrains Mono', monospace;
      --sans:        'Inter', system-ui, sans-serif;
      --radius:      10px;
      --transition:  0.15s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      gap: 0.75rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .logo {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #7e25c3);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 0.65rem;
      font-family: var(--mono);
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-glow);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    /* ── Model select ───────────────────────────────── */
    #model-select {
      font-family: var(--mono);
      font-size: 0.72rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.3rem 0.55rem;
      cursor: pointer;
      max-width: 140px;
      outline: none;
      transition: border-color var(--transition);
    }
    #model-select:focus { border-color: var(--accent); }

    /* ── Icon buttons ───────────────────────────────── */
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn:active { transform: scale(0.94); }

    /* ── Status dot ─────────────────────────────────── */
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .status-dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.err { background: var(--red);   box-shadow: 0 0 6px var(--red);   }

    /* ── Messages area ──────────────────────────────── */
    #messages {
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Message row ────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 26px; height: 26px;
      border-radius: 7px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      margin-top: 2px;
    }
    .msg-row.user .avatar {
      background: var(--accent);
    }
    .msg-row.assistant .avatar {
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .msg-wrap { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .msg-row.user .msg-wrap { align-items: flex-end; }

    .msg-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .bubble {
      padding: 0.7rem 0.95rem;
      border-radius: var(--radius);
      font-size: 0.91rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      max-width: 100%;
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      border: 1px solid #2a2650;
      border-radius: var(--radius) 3px var(--radius) var(--radius);
    }
    .msg-row.assistant .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border-dim);
      border-radius: 3px var(--radius) var(--radius) var(--radius);
    }

    /* streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* copy button on bubbles */
    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 0.65rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .bubble:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn.copied { color: var(--green); border-color: var(--green); }

    /* ── Empty state ────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex: 1;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }
    #empty-state .big { font-size: 2rem; }
    #empty-state p { font-size: 0.85rem; line-height: 1.5; max-width: 280px; }

    /* ── Input area ─────────────────────────────────── */
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 0.85rem 1rem;
    }

    .input-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    #msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      line-height: 1.5;
      outline: none;
      transition: border-color var(--transition);
    }
    #msg-input::placeholder { color: var(--text-dim); }
    #msg-input:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--transition);
    }
    #send-btn:hover:not(:disabled) { background: #6b5ae0; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn:active:not(:disabled) { transform: scale(0.93); }

    /* ── Bottom controls ────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 80px;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .char-count {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-left: auto;
    }
    .char-count.warn { color: #f59e0b; }

    /* ── Toast ──────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <div class="header-left">
    <div class="logo">🤖</div>
    <span class="title">LLM Chat Bot Using</span>
    <span class="badge" id="backend-badge">…</span>
  </div>
  <div class="header-right">
    <div class="status-dot" id="status-dot" title="Backend status"></div>
    <select id="model-select" title="Switch model">
      <option value="">Loading…</option>
    </select>
    <button class="icon-btn" id="clear-btn" title="Clear chat">🗑️</button>
  </div>
</header>

<!-- ── Messages ────────────────────────────────────────── -->
<div id="messages">
  <div id="empty-state">
    <div class="big">💬</div>
    <p>Start a conversation. Your last 10 messages are kept as context.</p>
  </div>
</div>

<!-- ── Input ───────────────────────────────────────────── -->
<div id="input-area">
  <div class="input-inner">
    <div class="input-row">
      <textarea id="msg-input" placeholder="Message…" rows="1"></textarea>
      <button id="send-btn" title="Send (Enter)">➤</button>
    </div>
    <div class="controls">
      <div class="slider-group">
        <label for="temp-slider">Temp</label>
        <input type="range" id="temp-slider" min="0" max="2" step="0.05" value="0.7">
        <span id="temp-val">0.70</span>
      </div>
      <span class="char-count" id="char-count">0</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── DOM refs ──────────────────────────────────────────
  const messagesEl  = document.getElementById('messages');
  const emptyState  = document.getElementById('empty-state');
  const msgInput    = document.getElementById('msg-input');
  const sendBtn     = document.getElementById('send-btn');
  const tempSlider  = document.getElementById('temp-slider');
  const tempVal     = document.getElementById('temp-val');
  const charCount   = document.getElementById('char-count');
  const modelSelect = document.getElementById('model-select');
  const clearBtn    = document.getElementById('clear-btn');
  const statusDot   = document.getElementById('status-dot');
  const backendBadge= document.getElementById('backend-badge');
  const toast       = document.getElementById('toast');

  // ── State ─────────────────────────────────────────────
  let history  = [];
  let isLoading= false;
  const sessionId = 'session_' + Math.random().toString(36).slice(2, 8);

  // ── Toast helper ─────────────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'show' + (isError ? ' error' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 2500);
  }

  // ── Time helper ───────────────────────────────────────
  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ── Build message bubble ──────────────────────────────
  function createRow(role, text = '', streaming = false) {
    emptyState.style.display = 'none';

    const row  = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = (role === 'user' ? 'You' : 'Assistant') + ' · ' + now();

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const textNode = document.createElement('span');
    textNode.className = 'msg-text';
    textNode.textContent = text;
    bubble.appendChild(textNode);

    if (streaming) {
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      bubble.appendChild(cursor);
    }

    // Copy button
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'copy';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(bubble.querySelector('.msg-text').textContent);
      copyBtn.textContent = 'copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'copy'; copyBtn.classList.remove('copied'); }, 1500);
    };
    bubble.appendChild(copyBtn);

    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    scrollBottom();

    return { row, textNode, bubble };
  }

  function scrollBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  // ── Auto-resize textarea ──────────────────────────────
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
    const len = msgInput.value.length;
    charCount.textContent = len;
    charCount.className = 'char-count' + (len > 800 ? ' warn' : '');
  });

  // ── Temperature slider ────────────────────────────────
  tempSlider.addEventListener('input', () => {
    tempVal.textContent = parseFloat(tempSlider.value).toFixed(2);
  });

  // ── Send on Enter ─────────────────────────────────────
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ── Clear chat ────────────────────────────────────────
  clearBtn.addEventListener('click', async () => {
    if (!history.length) return;
    history = [];
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = '';

    await fetch(`/api/chat/clear?session_id=${sessionId}`, { method: 'POST' }).catch(() => {});
    showToast('Chat cleared');
  });

  // ── Main send ─────────────────────────────────────────
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    msgInput.value = '';
    msgInput.style.height = 'auto';
    charCount.textContent = '0';

    createRow('user', text);

    // Streaming assistant row
    const { textNode, bubble } = createRow('assistant', '', true);
    let collected = '';

    try {
      const resp = await fetch(`/api/chat/stream?session_id=${sessionId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message:     text,
          temperature: parseFloat(tempSlider.value),
          history:     history,
          model:       modelSelect.value || undefined,
        }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep partial line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (!payload) continue;

          let parsed;
          try { parsed = JSON.parse(payload); } catch { continue; }

          if (parsed.error) throw new Error(parsed.error);

          if (parsed.chunk) {
            collected += parsed.chunk;
            textNode.textContent = collected;
            scrollBottom();
          }

          if (parsed.done) {
            history = parsed.history || history;
            // Remove cursor
            const cursor = bubble.querySelector('.cursor');
            if (cursor) cursor.remove();
          }
        }
      }
    } catch (err) {
      const cursor = bubble.querySelector('.cursor');
      if (cursor) cursor.remove();
      textNode.textContent = '⚠ ' + (err.message || 'Something went wrong.');
      showToast(err.message, true);
    }

    isLoading = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }

  // ── Load models & health ──────────────────────────────
  async function init() {
    try {
      const [healthRes, modelsRes] = await Promise.all([
        fetch('/health').then(r => r.json()),
        fetch('/api/models').then(r => r.json()),
      ]);

      if (healthRes.status === 'ok') {
        statusDot.className = 'status-dot ok';
        backendBadge.textContent = healthRes.backend || 'local';
      } else {
        statusDot.className = 'status-dot err';
        backendBadge.textContent = 'offline';
      }

      // Populate model dropdown
      const models = modelsRes.models || [];
      const current = modelsRes.current || '';
      modelSelect.innerHTML = '';
      if (!models.length) {
        modelSelect.innerHTML = '<option value="">No models</option>';
      } else {
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          if (m === current || m.startsWith(current.split(':')[0])) opt.selected = true;
          modelSelect.appendChild(opt);
        });
      }
    } catch {
      statusDot.className = 'status-dot err';
      backendBadge.textContent = 'offline';
      showToast('Cannot reach backend', true);
    }
  }

  init();
  msgInput.focus();
</script>
</body>
</html>
